name: domain
description: Domain layer containing entities, use cases, and repository interfaces for flutter_app
publish_to: 'none'
version: 0.0.1

# Inherit dependency versions from root pubspec.yaml
resolution: workspace

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  # Code Generation - versions inherited from root
  freezed_annotation: any
  json_annotation: any
  
  # Dependency Injection
  get_it: any
  injectable: any
  app_core: any
  
  # Local Storage
  shared_preferences: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any
  
  # Code Generation - versions inherited from root
  build_runner: any
  freezed: any
  json_serializable: any
  injectable_generator: any
