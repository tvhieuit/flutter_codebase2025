name: feature_app_settings
description: Common app settings feature (theme mode, language)
publish_to: 'none'
version: 0.0.1

# Inherit dependency versions from root pubspec.yaml
resolution: workspace

environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: '>=3.38.8 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Domain
  domain: any
  use_cases: any

  # App conventions (freezed macros)
  app_core: any

  # State management
  flutter_bloc: any

  # Internationalization
  flutter_localizations:
    sdk: flutter
  intl: any

  # Dependency injection
  get_it: any
  injectable: any

  # Codegen annotations
  freezed_annotation: any
  auto_route: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any

  # Code generation
  build_runner: any
  freezed: any
  injectable_generator: any
  auto_route_generator: any

flutter:
  generate: true

  # To add assets to your package, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
  #
  # For details regarding assets in packages, see
  # https://flutter.dev/to/asset-from-package
  #
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # To add custom fonts to your package, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts in packages, see
  # https://flutter.dev/to/font-from-package
