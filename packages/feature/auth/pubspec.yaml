name: feature_auth
description: Authentication feature package (login, register, logout)
publish_to: 'none'
version: 0.0.1

# Inherit dependency versions from root pubspec.yaml
resolution: workspace

environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: '>=3.38.8 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Domain layer
  domain: any
  
  # State Management
  flutter_bloc: any
  
  # Dependency Injection
  get_it: any
  injectable: any
  
  # Code Generation
  freezed_annotation: any
  json_annotation: any
  
  # Routing
  auto_route: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any
  
  # Code Generation
  build_runner: any
  freezed: any
  json_serializable: any
  injectable_generator: any
  auto_route_generator: any
