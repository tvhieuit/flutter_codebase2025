targets:
  $default:
    builders:
      injectable_generator:injectable_builder:
        enabled: true
        generate_for:
          include:
            - lib/**/*.dart
          exclude:
            - lib/l10n/**
      freezed:freezed:
        enabled: true
      json_serializable:json_serializable:
        enabled: true
      auto_route_generator:auto_route_generator:
        enabled: true
        options:
          enable_cached_builds: true
