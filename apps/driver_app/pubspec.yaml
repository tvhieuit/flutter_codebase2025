name: driver_app
description: Driver app for the platform
publish_to: 'none'
version: 1.0.0+1

resolution: workspace

environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: '>=3.38.8 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_bloc: any

  # Dependency Injection
  get_it: any
  injectable: any

  # Code Generation
  freezed_annotation: any
  json_annotation: any
  auto_route: any

  # Networking
  dio: any

  # Local Storage
  shared_preferences: any

  # Internal Packages
  app_widget: any
  domain: any
  feature_auth: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any

  # Code Generation
  build_runner: any
  freezed: any
  json_serializable: any
  injectable_generator: any
  auto_route_generator: any

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/icon/
    - assets/image/
