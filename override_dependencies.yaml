# Shared Dependency Versions
# This file centralizes all dependency versions for the workspace.
# All packages should use these versions to ensure consistency.
#
# Usage:
# 1. Define versions here
# 2. Reference in pubspec.yaml using dependency_overrides (if needed)
# 3. Or use as reference when adding dependencies to packages

# =============================================================================
# FLUTTER SDK
# =============================================================================
flutter_sdk: ">=3.38.8 <4.0.0"
dart_sdk: ">=3.9.0 <4.0.0"

# =============================================================================
# STATE MANAGEMENT
# =============================================================================
flutter_bloc: ^9.1.1
bloc_event_transformers: ^2.0.0

# =============================================================================
# DEPENDENCY INJECTION
# =============================================================================
get_it: ^9.2.0
injectable: ^2.7.1+2

# =============================================================================
# CODE GENERATION - ANNOTATIONS
# =============================================================================
freezed_annotation: ^3.1.0
json_annotation: ^4.9.0
auto_route: ^11.1.0
retrofit: ^4.9.1

# =============================================================================
# CODE GENERATION - GENERATORS (dev_dependencies)
# =============================================================================
build_runner: ^2.4.13
freezed: ^3.2.4
json_serializable: ^6.8.0
injectable_generator: ^2.6.2
auto_route_generator: ^10.4.0
retrofit_generator: ^10.2.1

# =============================================================================
# NETWORKING
# =============================================================================
dio: ^5.9.0

# =============================================================================
# LOCAL STORAGE
# =============================================================================
shared_preferences: ^2.5.4

# =============================================================================
# UTILITIES
# =============================================================================
connectivity_plus: ^7.0.0
permission_handler: ^12.0.1

# =============================================================================
# TESTING
# =============================================================================
flutter_lints: ^6.0.0
melos: ^7.3.0
