name: flutter_app_workspace
description: Workspace root for Flutter monorepo
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: '>=3.38.8 <4.0.0'

workspace:
  - apps/flutter_app
  - apps/customer_app
  - apps/driver_app
  - packages/app_utility
  - packages/app_widget
  - packages/domain
  - packages/feature/auth
  - packages/app_core

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_bloc: ^9.1.1
  bloc_event_transformers: ^2.0.0

  # Dependency Injection
  get_it: ^9.2.0
  injectable: ^2.7.1+2

  # Code Generation
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  auto_route: ^11.1.0

  # Networking
  dio: ^5.9.0
  retrofit: ^4.9.1

  # Local Storage
  shared_preferences: ^2.5.4

  # Network Connectivity
  connectivity_plus: ^7.0.0

  # Permissions
  permission_handler: ^12.0.1

  # Internal Packages
  app_utility: ^0.0.1
  app_widget: ^0.0.1
  domain: ^0.0.1
  feature_auth: ^0.0.1
  fluttertoast: ^9.0.0
  app_core: ^0.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.4.13
  freezed: ^3.2.4
  json_serializable: ^6.8.0
  injectable_generator: ^2.6.2
  auto_route_generator: ^10.4.0
  retrofit_generator: ^10.2.1
  melos: ^7.3.0

melos:
  sdkPath: .fvm/flutter_sdk
  categories:
    app:
      - "apps/*"
    packages:
      - "packages/**"
  scripts:

    pg:
      run: fvm dart run melos exec --concurrency=1 -- fvm dart pub get --no-example
      packageFilters:
        scope:

    po:
      run: fvm dart run melos exec --concurrency=1 -- fvm dart pub outdated
      packageFilters:
        scope:

    pu:
      run: fvm dart run melos exec --concurrency=1 -- fvm dart pub upgrade --major-versions
      packageFilters:
        scope:

    l10n:
      run: fvm dart run melos exec --concurrency=1 -- fvm flutter gen-l10n
      packageFilters:
        scope:
          - "flutter_app"
          - "feature_auth"
          - "customer_app"
          - "driver_app"

    br:
      run: fvm dart run melos exec --concurrency=1 -- fvm dart run build_runner build
      packageFilters:
        scope:

    brd:
      run: fvm dart run melos exec --concurrency=1 -- fvm dart run build_runner build -d
      packageFilters:
        scope:

    fm:
      run: fvm dart run melos exec --concurrency=1 -- fvm dart format .
      packageFilters:
        scope:

    icon:
      run: fvm dart run melos exec --concurrency=1 -- fvm dart run flutter_launcher_icons
      packageFilters:
        scope:

    fix:
      run: fvm dart run melos exec --concurrency=1 -- fvm dart fix --apply
      packageFilters:
        scope:

    test:
      run: fvm dart run melos exec --concurrency=1 -- fvm flutter test
      packageFilters:
        scope:

    test:coverage:
      run: fvm dart run melos exec --concurrency=1 -- fvm flutter test --coverage
      packageFilters:
        scope:

    test:watch:
      run: fvm dart run melos exec --concurrency=1 -- fvm flutter test --watch
      packageFilters:
        scope:

    aos:devapk:
      run: fvm dart run melos exec --concurrency=1 -- fvm flutter build apk --release --flavor dev --dart-define-from-file=./configs/dev.json
      packageFilters:
        scope:

    aos:stgapk:
      run: fvm dart run melos exec --concurrency=1 -- fvm flutter build apk --release --flavor stg --dart-define-from-file=./configs/stg.json
      packageFilters:
        scope:

    aos:betaapk:
      run: fvm dart run melos exec --concurrency=1 -- fvm flutter build apk --release --flavor beta --dart-define-from-file=./configs/beta.json
      packageFilters:
        scope:

    aos:dev:
      run: fvm dart run melos exec --concurrency=1 -- fvm flutter build appbundle --release --flavor dev --dart-define-from-file=./configs/dev.json
      packageFilters:
        scope:

    aos:stg:
      run: fvm dart run melos exec --concurrency=1 -- fvm flutter build appbundle --release --flavor stg --dart-define-from-file=./configs/stg.json
      packageFilters:
        scope:

    aos:beta:
      run: fvm dart run melos exec --concurrency=1 -- fvm flutter build appbundle --release --flavor beta --dart-define-from-file=./configs/beta.json
      packageFilters:
        scope:

    ios:dev:
      run: fvm dart run melos exec --concurrency=1 -- fvm flutter build ipa --release --flavor dev --dart-define-from-file=./configs/dev.json
      packageFilters:
        scope:

    ios:stg:
      run: fvm dart run melos exec --concurrency=1 -- fvm flutter build ipa --release --flavor stg --dart-define-from-file=./configs/stg.json
      packageFilters:
        scope:

    ios:beta:
      run: fvm dart run melos exec --concurrency=1 -- fvm flutter build ipa --release --flavor beta --dart-define-from-file=./configs/beta.json

# =============================================================================
# DEPENDENCY OVERRIDES
# =============================================================================
# Use this section to force specific versions across all packages.
# Useful for:
# - Fixing version conflicts
# - Testing new versions
# - Ensuring all packages use exact same version
#
# Example:
# dependency_overrides:
#   freezed_annotation: 3.1.0
#   json_annotation: 4.9.0
